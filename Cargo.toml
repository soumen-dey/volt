[package]
name = "js-engine"
version = "0.1.0"
edition = "2024"
description = "An embeddable headless ECMAScript runtime backed by Boa"

[lib]
name = "js_engine"
path = "src/lib.rs"

[[bin]]
name = "js-engine"
path = "src/main.rs"

[dependencies]
boa_engine = { version = "0.22.0", features = ["intl_bundled"] }
