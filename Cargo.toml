[package]
name = "volt-engine"
version = "0.1.0"
edition = "2024"
description = "A from-scratch headless JavaScript interpreter in Rust"

[dependencies]
regress = { version = "0.12", features = ["utf16"] }

[lib]
name = "volt_engine"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "volt"
path = "src/main.rs"

[[bench]]
name = "runtime"
harness = false
